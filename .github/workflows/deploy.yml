name: CD

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-test:
    name: Check & Test
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to NPM
    needs: [check-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check version matches tag
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./package.json').version")"

      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance --access public
